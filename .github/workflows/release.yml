# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the .deb and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
# The in-app "Check for Updates…" reads these releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches VERSION
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' jonsbo_th_common.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in jonsbo_th_common.py"
            exit 1
          fi

      - name: Check Python syntax
        run: python3 -m py_compile jonsbo_th_common.py jonsbo_th_update.py jonsbo-th-daemon jonsbo-th-gui jonsbo-th-tray

      - name: Build .deb
        run: ./build-deb.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "jonsbo-th $GITHUB_REF_NAME" --generate-notes
