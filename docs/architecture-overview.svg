<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"
     font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', 'Segoe UI', sans-serif">
  <defs>
    <marker id="a-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
    <marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="a-bus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#0d1117"/>

  <!-- Title -->
  <text x="30" y="38" font-size="22" font-weight="700" fill="#e6edf3">jonsbo-th · Architecture overview</text>

  <!-- Band labels -->
  <text x="30" y="72" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="1">MAIN FLOW</text>
  <text x="30" y="252" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="1">2 SHARED FILES</text>
  <text x="30" y="412" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="1">USER INTERFACE</text>

  <!-- ============ Row 1: main pipeline ============ -->
  <!-- Sensors -->
  <rect x="30" y="85" width="210" height="100" rx="12" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="135" y="118" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">Temperature sensors</text>
  <text x="135" y="142" font-size="13" fill="#b1bac4" text-anchor="middle">CPU · GPU · SSD · board</text>
  <text x="135" y="164" font-size="12" fill="#8b949e" text-anchor="middle" font-family="monospace">/sys/class/hwmon</text>

  <!-- Daemon (core) -->
  <rect x="370" y="75" width="240" height="120" rx="14" fill="#2a1a0c" stroke="#f0883e" stroke-width="2.5"/>
  <text x="490" y="108" font-size="18" font-weight="700" fill="#ffa657" text-anchor="middle" font-family="monospace">jonsbo-th-daemon</text>
  <text x="490" y="132" font-size="13" fill="#b1bac4" text-anchor="middle">Background service · always on</text>
  <text x="490" y="154" font-size="13" fill="#b1bac4" text-anchor="middle">highest / average / lowest</text>
  <text x="490" y="176" font-size="12" fill="#8b949e" text-anchor="middle">updates every 0.5 s</text>

  <!-- Cooler display -->
  <rect x="730" y="75" width="200" height="120" rx="14" fill="#000000" stroke="#484f58" stroke-width="2"/>
  <text x="830" y="100" font-size="13" fill="#c9d1d9" text-anchor="middle">Jonsbo TH cooler display</text>
  <text x="830" y="160" font-size="50" font-weight="700" fill="#ff4530" text-anchor="middle" font-family="monospace">45°C</text>
  <text x="830" y="183" font-size="11" fill="#8b949e" text-anchor="middle" font-family="monospace">USB 5131:2007</text>

  <!-- Arrows row 1 -->
  <line x1="242" y1="135" x2="366" y2="135" stroke="#f0883e" stroke-width="3" marker-end="url(#a-main)"/>
  <text x="304" y="124" font-size="13" font-weight="700" fill="#ffa657" text-anchor="middle">① read</text>
  <line x1="612" y1="135" x2="726" y2="135" stroke="#f0883e" stroke-width="3" marker-end="url(#a-main)"/>
  <text x="669" y="124" font-size="13" font-weight="700" fill="#ffa657" text-anchor="middle">③ send value</text>
  <text x="669" y="155" font-size="11" fill="#8b949e" text-anchor="middle" font-family="monospace">64 byte</text>
  <text x="669" y="169" font-size="11" fill="#8b949e" text-anchor="middle" font-family="monospace">/dev/hidraw</text>

  <!-- ============ Row 2: shared files ============ -->
  <!-- config.json -->
  <path d="M250,265 h170 l20,20 v55 h-190 z" fill="#0b2541" stroke="#58a6ff" stroke-width="1.5"/>
  <path d="M420,265 v20 h20" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="345" y="297" font-size="16" font-weight="700" fill="#79c0ff" text-anchor="middle" font-family="monospace">config.json</text>
  <text x="345" y="320" font-size="13" fill="#b1bac4" text-anchor="middle">settings: sensors, mode…</text>

  <!-- status.json -->
  <path d="M540,265 h170 l20,20 v55 h-190 z" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
  <path d="M710,265 v20 h20" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="635" y="297" font-size="16" font-weight="700" fill="#3fb950" text-anchor="middle" font-family="monospace">status.json</text>
  <text x="635" y="320" font-size="13" fill="#b1bac4" text-anchor="middle">shown value, last error</text>

  <!-- daemon <-> files -->
  <line x1="390" y1="263" x2="440" y2="199" stroke="#3fb950" stroke-width="2" marker-end="url(#a-read)"/>
  <text x="372" y="226" font-size="13" font-weight="700" fill="#3fb950" text-anchor="end">② read settings</text>
  <line x1="540" y1="199" x2="590" y2="261" stroke="#58a6ff" stroke-width="2" marker-end="url(#a-write)"/>
  <text x="582" y="226" font-size="13" font-weight="700" fill="#58a6ff">④ write status</text>

  <!-- ============ Row 3: user interface ============ -->
  <!-- GUI -->
  <rect x="200" y="425" width="240" height="95" rx="12" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="320" y="455" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle" font-family="monospace">jonsbo-th-gui</text>
  <text x="320" y="478" font-size="13" fill="#b1bac4" text-anchor="middle">Settings window</text>
  <text x="320" y="499" font-size="12" fill="#8b949e" text-anchor="middle">live display preview</text>

  <!-- Tray -->
  <rect x="500" y="425" width="240" height="95" rx="12" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="620" y="455" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle" font-family="monospace">jonsbo-th-tray</text>
  <text x="620" y="478" font-size="13" fill="#b1bac4" text-anchor="middle">Top-bar (tray) icon</text>
  <text x="620" y="499" font-size="12" fill="#8b949e" text-anchor="middle">quick mode menu</text>

  <!-- GNOME Shell -->
  <rect x="800" y="425" width="135" height="95" rx="12" fill="#1f1736" stroke="#a371f7" stroke-width="1.5"/>
  <text x="867" y="461" font-size="15" font-weight="700" fill="#d2a8ff" text-anchor="middle">GNOME Shell</text>
  <text x="867" y="484" font-size="12" fill="#b1bac4" text-anchor="middle">AppIndicators</text>

  <!-- GUI / tray -> config (write, blue) -->
  <line x1="290" y1="423" x2="318" y2="344" stroke="#58a6ff" stroke-width="2" marker-end="url(#a-write)"/>
  <line x1="540" y1="423" x2="420" y2="344" stroke="#58a6ff" stroke-width="2" marker-end="url(#a-write)"/>
  <text x="270" y="388" font-size="13" font-weight="700" fill="#58a6ff" text-anchor="end">⑤ write settings</text>

  <!-- status -> GUI / tray (read, green) -->
  <line x1="560" y1="344" x2="400" y2="421" stroke="#3fb950" stroke-width="2" marker-end="url(#a-read)"/>
  <line x1="660" y1="344" x2="660" y2="421" stroke="#3fb950" stroke-width="2" marker-end="url(#a-read)"/>
  <text x="672" y="388" font-size="13" font-weight="700" fill="#3fb950">⑥ read &amp; display</text>

  <!-- tray <-> GNOME Shell -->
  <line x1="744" y1="472" x2="796" y2="472" stroke="#a371f7" stroke-width="2" marker-start="url(#a-bus)" marker-end="url(#a-bus)"/>
  <text x="770" y="463" font-size="11" font-weight="700" fill="#a371f7" text-anchor="middle">D-Bus</text>

  <!-- ============ Footer legend ============ -->
  <line x1="30" y1="548" x2="930" y2="548" stroke="#30363d"/>
  <line x1="30" y1="572" x2="62" y2="572" stroke="#f0883e" stroke-width="3" marker-end="url(#a-main)"/>
  <text x="70" y="577" font-size="12" fill="#b1bac4">temperature data</text>
  <line x1="180" y1="572" x2="212" y2="572" stroke="#58a6ff" stroke-width="2" marker-end="url(#a-write)"/>
  <text x="220" y="577" font-size="12" fill="#b1bac4">writes file</text>
  <line x1="310" y1="572" x2="342" y2="572" stroke="#3fb950" stroke-width="2" marker-end="url(#a-read)"/>
  <text x="350" y="577" font-size="12" fill="#b1bac4">reads file</text>
  <text x="930" y="577" font-size="12" fill="#8b949e" text-anchor="end">systemd --user starts the daemon and tray at login · no root needed</text>
</svg>
