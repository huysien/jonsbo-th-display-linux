<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Pump display panel -->
  <rect x="8" y="20" width="112" height="88" rx="20" fill="#16161a" stroke="#3a3a42" stroke-width="4"/>
  <!-- "°C" as a 7-segment glyph: a generic unit sign, never a reading -->
  <g fill="#ff4530" transform="skewX(-6) translate(10 0)">
    <!-- C: segments a, f, e, d -->
    <rect x="52" y="36" width="34" height="8" rx="3.5"/>
    <rect x="45" y="41" width="8" height="23" rx="3.5"/>
    <rect x="45" y="66" width="8" height="23" rx="3.5"/>
    <rect x="52" y="86" width="34" height="8" rx="3.5"/>
  </g>
  <circle cx="35" cy="44" r="8" fill="none" stroke="#ff4530" stroke-width="5"/>
</svg>
